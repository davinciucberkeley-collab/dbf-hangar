# Gate registry (§2.5). One entry per tier; core/hangar/gates/__init__.py reads it. discipline_checks: sub-checks of a tier (U3.6), report-only until the same date.
# blocking: false = report-only (D7): FAIL and SKIP show as WARN until 2026-12-08, then flip to true.
version: "0.1"
gates:
  - {id: T0.schema,        tier: 0, blocking: true,  needs: [], criterion: "schema/plane.schema.json"}
  - {id: T1.geometry,      tier: 1, blocking: true,  needs: [], criterion: "design-standards.yaml#interference_max_mm3"}
  - {id: T2.physics,       tier: 2, blocking: true,  needs: [], criterion: "design-standards.yaml#landing_load_factor"}
  - {id: T3.aero,          tier: 3, blocking: true,  needs: [], criterion: "design-standards.yaml#static_margin"}
  - {id: T4.manufacturing, tier: 4, blocking: true,  needs: [], criterion: "manufacturing.yaml"}
  - {id: T5.standards,     tier: 5, blocking: true,  needs: [], criterion: "design-standards.yaml#faa_part107_max_mass_g"}
  - {id: T6.mechanisms,    tier: 6, blocking: true,  needs: [], criterion: "gate-thresholds.yaml#mechanism_ratio_tol"}
  - {id: T7.integration,   tier: 7, blocking: false, needs: [], criterion: "gate-thresholds.yaml#wire_clearance_mm"}
  - {id: T8.sourcing,      tier: 8, blocking: false, needs: [], criterion: "gate-thresholds.yaml#bom_verified_max_age_days"}
  - {id: T9.claims,        tier: 9, blocking: true,  needs: [], criterion: "claims.yaml#recompute_rel_tol"}
discipline_checks:
  - {id: T2.joint_rf,            tier: 2, blocking: false, criterion: "load-cases.yaml#joint_rf_min"}
  - {id: T3.control_authority,   tier: 3, blocking: false, criterion: "operations.yaml#hover_ctrl_factor"}
  - {id: T3.transition_margin,   tier: 3, blocking: false, criterion: "operations.yaml#transition_thrust_fraction_max"}
  - {id: T3.endurance,           tier: 3, blocking: false, criterion: "operations.yaml#energy_reserve_fraction"}
  - {id: T7.electrical_rating,   tier: 7, blocking: false, criterion: "connection-types.yaml#wire_ampacity_a"}
  - {id: T3.wing_loading,        tier: 3, blocking: false, criterion: "fixed-wing.yaml#wing_loading_max_g_dm2"}
  - {id: T3.cruise_stall_ratio,  tier: 3, blocking: false, criterion: "fixed-wing.yaml#cruise_to_stall_ratio_min"}
  - {id: T3.tail_volume,         tier: 3, blocking: false, criterion: "stability.yaml#tail_volume_h_min"}
