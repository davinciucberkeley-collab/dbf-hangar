  source: 'std-ct-fasteners (engineeringtoolbox, table "Metric Bolts - Coarse Threads - Proof Loads")'
- id: CT-M3-SHCS-MOTOR
  kind: mechanical
  method: fastened
  spec: M3 SHCS into motor base tapped hole (manufacturer pattern)
  rating_basis: sourced
  source: 'std-ct-fasteners (engineeringtoolbox, table "Metric Bolts - Coarse Threads - Proof Loads")'
- id: CT-M4-SHCS-NYLOC
