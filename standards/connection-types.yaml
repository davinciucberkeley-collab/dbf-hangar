  rating_basis: placeholder
  source: pending
- id: CT-EPOXY
  kind: mechanical
  method: bonded
  spec: epoxy bond (30 min laminating epoxy), surfaces scuffed
  rating_basis: sourced
  source: 'std-ct-adhesives-tapes-2 (Pawlak, Epoxyworks Spring 2003, species table (epoxyworks.com/epoxys-adhesion-to-wood/))'
  note: "6.85 MPa, tensile pull-off (PATTI) on wood, WEST SYSTEM 105/206 (spec names a 30 min laminating epoxy; product match not checked), lowest species (Narra, Padauk); failure in wood; two specimens per species, not conclusive; lap shear not found; per area, no rated_load_n until a joint area is known"
- id: CT-CA
  kind: mechanical
  method: bonded
  spec: cyanoacrylate bond (foam-safe CA where foam)
  rating_basis: sourced
  source: 'std-ct-adhesives-tapes-2 (Permabond 240 TDS Rev 6, 13 Sep 2025, p.1 "Typical Performance of Cured Adhesive")'
  note: "> 5 MPa (N/mm2), ISO 4587 shear to polycarbonate, substrate failure, lower bound; typical, strength varies with surface prep and gap; no balsa or foam value found; per area, no rated_load_n until a joint area is known"
- id: CT-TUBE-CLAMP
