# Shared connection-type library for PDL attachments[].connection (T1.interfaces.connection_known).
# Adapted from DBF-Combined redesign/interfaces/connection_types.json @ a93f14d (44 types, ids kept).
# rating_basis: sourced | derived | placeholder (same meaning as attachment.rating_basis). source: a citation, or `pending`.
# Types with rating_basis sourced have a value or stress from an opened source (U4.19); the rest stay placeholder / pending with the reason on the source line.
# structural: false marks a type that locates a part but never carries its flight load; omitted means true.
version: '0.1'
wire_ampacity_a:
  value: {8: 100, 10: 75, 12: 55, 14: 45, 16: 32, 18: 24, 20: 17, 22: 13, 24: 10, 26: 7}
  rule: "Current a wire gauge (AWG) may carry; T7.electrical_rating compares the peak battery current with it (times `operations.yaml#wire_pair_derate`). Assumes silicone (200 C class) insulation; PDL has no insulation field."
  source: "Multicable reference table, via knowledge/sources/std-wire-ampacity.md"
  note: "free air, 30 C ambient; bundled harnesses derate"
connection_types:
- id: CT-M2-SCREW-PLASTIC
  kind: mechanical
  method: fastened
  spec: M2 self-tapping or machine screw into printed/plastic boss (servo ears)
  rating_basis: placeholder
  source: pending
# rated_load_n: ultimate pull-out or tensile N (std-ct-fasteners, std-ct-straps-hinges-thermal); omitted = no opened source
- id: CT-M3-SHCS-INSERT
  kind: mechanical
  method: fastened
  spec: M3 SHCS into M3 brass heat-set insert
  rating_basis: sourced
  source: 'std-ct-fasteners ("Are Our Heat-Set Insert Datasheets Wrong?", sections "Pull-out strength of the as-printed samples" and "Printing and drilling the test samples")'
  rated_load_n: 1167
- id: CT-M3-SHCS-NYLOC
  kind: mechanical
  method: fastened
  spec: M3 SHCS through clearance hole, nyloc nut
