  source: 'std-ct-fasteners (engineeringtoolbox, table "Metric Bolts - Coarse Threads - Proof Loads")'
- id: CT-PROP-ADAPTER
  kind: mechanical
  method: fastened
  spec: bolt-on prop adapter, 3 x M2.5 SHCS on a 15 mm circle into the motor bell, pilot on the shaft
  rating_basis: placeholder
  source: pending
- id: CT-PROP-NUT
