# Thresholds for the T6 to T8 gates. Every entry needs a source; `source: pending` means provisional.
# Kept apart from design-standards.yaml because core/hangar/fea.py hashes that file (D13, U2.3).
# Criterion links look like: gate-thresholds.yaml#<key>
version: "0.1"
mechanism_ratio_tol:
  value: 0.05
  rule: "A follower must reach ratio x input within this fraction of ratio x input (or mechanism_abs_tol_deg, whichever is larger). T6.ratio also accepts a declared ratio within this fraction of the ratio measured from mechanisms[].link."
  source: internal convention
mechanism_abs_tol_deg:
  value: 0.5
  rule: "Absolute tolerance floor, in degrees, for the follower angle check (small inputs). T6.ratio uses it as a ratio floor: this many degrees divided by the largest absolute input of the mechanism."
  source: internal convention
mechanism_contact_step_deg:
  value: 1.0
  rule: "Unattached-pair interference is checked at every multiple of this many degrees of driver input (absolute grid, so 0 is always on it), and always at both ends of the input range."
  source: internal convention
wire_clearance_mm:
  value: 5.0
  rule: "A harness segment between consecutive route components must lie inside the union of their envelopes grown by this distance."
  source: pending
  note: "D5: Dillon has not given a clearance; 5 mm is provisional."
transport_box_mm:
  value: [1250, 550, 450]
  rule: "Default transport box [length, width, height] when requirements.transport_box_mm is absent; each disassembly group's oriented bounding box must fit."
  source: team constraint
  note: "D5: from DBF-Combined's K09-L box constraint (about 1.25 x 0.55 x 0.45 m)."
bom_verified_max_age_days:
  value: 30
  rule: "A BOM line's verified.date may be at most this many days old."
  source: internal convention
servo_must_drive_mechanism:
  value: true
  rule: "On a conventional fixed-wing design every servo is the parent of the driver attachment of some mechanisms[] entry; T6.servo_undriven is a WARN for a servo that is not."
  source: pending
  note: "Team expectation from the control-surface recipe (docs/mechanisms.md); no external source yet. Report-only: the row is a WARN."

wing_area_complete_min:
  value: 0.97
  rule: "T3.wing_area_complete: the measured planform area of a generated core wing divided by the area its wing_panel params give must be at least this; below it the wing has uncovered chord (a WARN)."
  source: pending
  note: "Strip measurement agrees with the params within 0.1 % on a complete wing (U13.7-5 findings); 0.97 leaves room for sweep and airfoil tip effects; internal expectation, no external source."
four_bar_min_transmission_deg:
  value: 10.0
  rule: "T6.mechanism with kinematics: four_bar FAILs (jam) when the transmission angle between the pushrod and the horn arm falls below this at any input."
  source: pending
  note: "Provisional; no published source opened (U16.1 S1). 90 deg is the ideal, 0 deg a dead point."
four_bar_max_follower_step_deg:
  value: 10.0
  rule: "T6.mechanism with kinematics: four_bar FAILs (branch flip) when the solved follower angle changes by more than this between two consecutive 1 degree input steps."
  source: pending
  note: "Provisional; no published source opened (U16.1 S1)."

mtow_declared_in_design:
  value: "the design's own requirements.mtow_g"
  rule: "T3.mass: the rolled-up mass must not exceed the design's declared requirements.mtow_g. Rows citing requirements.mtow_g resolve here (fidelity.CRITERION_ALIASES)."
  source: pending
  note: "U17.1 2b: a per-design declared requirement, sourced in each design's own comment, not a shared threshold; left pending (D91, conductor decision)."
connection_named_in_library:
  value: true
  rule: "T1.interfaces.connection_known: every named connection exists in standards/connection-types.yaml. Rows citing connection-types.yaml (bare) resolve here (fidelity.CRITERION_ALIASES)."
  source: pending
  note: "U17.1 2b: library membership is a definition; left pending (D91, conductor decision)."
