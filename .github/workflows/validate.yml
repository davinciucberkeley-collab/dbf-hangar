name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore: ['plans/**', 'reviews/**', 'PROGRESS.md', 'ledger/**']   # plan-only commits: progress.yml checks them
  push:
    branches: [main, 'std/**']
    paths-ignore: ['plans/**', 'reviews/**', 'PROGRESS.md', 'ledger/**']

concurrency:
  group: validate-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/std/') || github.event_name == 'pull_request' }}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0   # the base branch (or the previous push) must be present for --base-ref
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[mcp,dev]"
      - name: Playwright version
        id: pw
        shell: bash
        run: echo "v=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Browser path
        shell: bash
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pw-browsers
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Browser for viewer smoke test
        shell: bash
        run: |
          python -m playwright install chromium
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install-deps chromium; fi
      - name: Unit tests (shard ${{ matrix.shard }} of 3)
        shell: bash
        run: pytest -q -n auto -m "" --shard ${{ matrix.shard }}/3
      - name: Designs and code stay apart
        if: matrix.shard == 1
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          python harness/ci/check_separation.py --base "$base" --labels "$LABELS"
      - name: PROGRESS.md is current
        if: matrix.shard == 1
        shell: bash
        run: plane progress --check
      - name: Check designs against their baselines
        if: matrix.shard == 1
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref || 'main' }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          args=(--all --format md)
          if [ -n "$base" ]; then args+=(--base-ref "$base"); fi
          echo "# Baseline check" >> "$GITHUB_STEP_SUMMARY"
          plane baseline check "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
