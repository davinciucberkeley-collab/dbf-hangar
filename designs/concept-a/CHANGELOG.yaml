- date: '2026-11-21T23:28:36Z'
  key: attachments[E-MEC-02].articulation.range_deg[0]
  old: -36
  new: -35
  why: 'T6 rod/horn clipped at +-1..3 deg input with servo range +-36 because the
    sampled input grid (every 5 deg from -36) lands on -1: servo range tightened to
    +-35 (grid then lands on 0, +-5, ...); ratio signs set from the rod geometry (+x
    arm tip motion for +z rotation on the right drives the horn pin -x, i.e. negative
    E-WNG-10 angle; mirrored on the left): right -0.57, left +0.57. Not a clearance
    fix: rod and horn still clip within +-3 deg because no rod-horn link is modelled'
  kind: modify
