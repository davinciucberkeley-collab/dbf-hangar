# Derived from `concept-a` by `plane design copy`; hand-maintained from here. The geometry of four parts
# (wng-001, wng-002, fin-001-l/r) is generated (PDL 1.2); the rest is the importer's output of `concept-a`.
# Frame unchanged: origin at the wing LE at the centre, mm.
schema_version: "1.2"
id: concept-a-param
name: Concept A, parametric copy (D70 demo)
authors: ["UC Berkeley DBF capstone team (source repo dbf-combined)", "imported for dbf-hangar by `plane import dbf`"]
status: designed
description: >
  Four canted motors (T-Motor MN2212 KV780, APC 9x4.5 props) on four carbon arms off a printed hub, a 0.90 m x 0.245 m
  XPS-foam wing (Selig S5010) with two elevons, two fin tubes that double as the four landing feet. Sits on the fin
  tips nose-up for hover. Built from the team's own CAD (redesign/qp/A/cad/model, stub backend). Nothing built or flown.
lineage:
  derived_from: [concept-a]
  inspired_by: ["dbf-combined@a93f14da redesign/qp/A/cad (a_model.py, amodel/), qp/A/params-A.json"]
morphology:
  lift: flying-wing
  vtol_method: tailsitter
  tail: none            # no tail; two fin tubes (FIN-001/002/004) at y +-380 mm act as fins and landing legs
  propulsion_count: 4   # PRP-001-UR/UL/LR/LL
requirements:
  mtow_g: 1470              # params-A.json req.mass_gate_kg 1.47 kg (A-P1 weigh-in gate)
  cruise_speed_mps: 17        # params-A.json mission.cruise_ms
  stall_speed_max_mps: 13.08    # params-A.json mission.cruise_ms 17 / req.cruise_ratio 1.3 (A-P6: 1.3 Vs < cruise)
  budget_usd: 2000           # params-A.json req.budget_usd
  transport_box_mm: [1200, 500, 400]   # params-A.json req.box_limit_m
flight:
  cl_max: 0.75            # params-A.json mission.clmax 0.75, EST in the source (measured stall will replace it)
  air_density_kgm3: 1.2   # params-A.json env.rho_kgm3 (MISSION.md s1)
  cruise_ld: 7.19
  cruise_ld_source: "DBF-Combined a93f14d redesign/qp/A/MISSION.md l.17 cruise L/D 7.19 at 1.37 kg and 17 m/s (S5010 aero model, EST)"
  # no hover_pose: a tailsitter hovers nose-up with no tilting joint, and the validator then takes -x as up
root: wng-001

materials:
  xps-tape-lumped:
    density_g_cm3: 0.03499
    notes: "XPS 25 kg/m3 core + tape skin + glue + hinge tape, lumped (PARTS['WNG-001'] 100.1 g); calibrated at the nominal generated core volume with the spar bore, so the nominal copy weighs what the source part weighs"
parameters:
  span_mm: 900          # common.py:32 B = 0.90
  chord_mm: 245         # common.py:32 C = 0.245
  spar_x_mm: 60         # common.py:38 SPAR_X
  spar_od_mm: 12        # common.py:38 SPAR_OD
  spar_id_mm: 10        # common.py:38 SPAR_ID
  fin_x_mm: 294         # common.py:46 XFIN_T
  fin_len_mm: 360       # common.py:46 2 * FIN_H (0.18)
  fin_od_mm: 16         # common.py:47 FIN_OD
  fin_id_mm: 14         # common.py:47 FIN_ID

