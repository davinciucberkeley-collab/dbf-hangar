assembly:
  sequence:
  - step: 1
    add:
    - wng-001
    note: 'A1: Wing core on the bench (lower surface up)'
  - step: 2
    add:
    - wng-002
    note: 'A2: Spar through the core bore from the right tip'
  - step: 3
    add:
    - wng-003-c
    note: 'A3: Centre plug up the bore'
  - step: 4
    add:
    - wng-004-r
    - wng-005-r
    note: 'A4: Right plugs up the bore'
  - step: 5
    add:
    - wng-004-l
    - wng-005-l
    note: 'A5: Left plugs up the bore from the left tip'
  - step: 6
    add:
    - cge-001
    - cge-004
    - cge-006
    - cge-002-a
    - cge-002-b
    - cge-003-ur
    - cge-003-ul
    - cge-003-lr
    - cge-003-ll
    - cge-009-ur
    - cge-009-ul
    - cge-009-lr
    - cge-009-ll
    - cge-010-ur
    - cge-010-ul
    - cge-010-lr
    - cge-010-ll
    - cge-010-c
    - cge-005-r
    - cge-005-l
    - cge-007-r
    - cge-007-l
    - prp-001-ur
    - prp-001-ul
    - prp-001-lr
    - prp-001-ll
    - prp-004-ur
    - prp-004-ul
    - prp-004-lr
    - prp-004-ll
    - prp-002-ur
    - prp-002-ul
    - prp-002-lr
    - prp-002-ll
    - prp-005-ur
    - prp-005-ul
    - prp-005-lr
    - prp-005-ll
    note: 'B1: Cage unit (hub, arms, cups, bridge, struts, saddle, clips, motors, props) built on the bench, docked from below: clips snap on the spar; before this step, B0a: Bench: cut the two arm tubes (552.4 mm of 12x10), the bridge (108 mm, D-206, from the 16x14 fin-tube offcut) and the two struts (286.2 mm of 6x4.5) from the carbon stock; sand the ends square; before this step, B0k: THREAD (bench, before the motors go on the cups): feed the three 20 AWG leads of each motor (400 mm stock + extension, EST) from the cup side through the 4.8 mm lead hole, the collar and the tube bore to the 4.8 mm exit hole at s +-18 mm; the free ends are laid flat along the tube until the hub conduits are on (B2b1-B2b4); then screw the motors on (B1)'
  - step: 7
    add:
    - fin-005-r
    - fin-005-l
    note: 'B2: Rib saddles snap on the spar from below'
  - step: 8
    add:
    - hrn-003-r
    - hrn-003-l
    note: 'B2a: D-199: phase-lead raceways R and L lowered from above into their foam grooves (through the slots in the hub pad flange), before the tray'
  - step: 9
    add:
    - hrn-004-ur
    note: 'B2b1: D-202: hub conduit UR lowered onto its sleeve and the raceway window (along the tube t axis, toward the tube)'
  - step: 10
    add:
    - hrn-004-ul
    note: 'B2b2: D-202: hub conduit UL lowered onto its sleeve and the raceway window'
  - step: 11
    add:
    - hrn-004-lr
    note: 'B2b3: D-202: hub conduit LR raised onto its sleeve and the raceway window (from below)'
  - step: 12
    add:
    - hrn-004-ll
    note: 'B2b4: D-202: hub conduit LL raised onto its sleeve and the raceway window (from below)'
  - step: 13
    add:
    - cge-008
    note: 'B3: Pack tray lowered from above into the core tray slot, bonded to the hub aft face; before this step, B2c: THREAD: feed the free ends of the 12 phase strands (B0) through their hub conduit, the raceway and the foam ditch (fish thread from the ditch end); the free ends stay out at x 29 mm for the ESC pads'
  - step: 14
    add:
    - wng-009-r
    - wng-010-r
    - wng-009-l
    - wng-010-l
    note: 'B4: Hinge damper units (stator with rotor in its annulus, silicone fluid filled) into the core notches at the elevon tips from aft, before the ribs; the notch is open aft'
  - step: 15
    add:
    - fin-002-r
    - fin-002-l
    note: 'C1: Ribs in from aft into the saddle sockets'
  - step: 16
    add:
    - fin-006-r
    - fin-006-l
    note: 'C1a: Rib fairings (upper blisters over the rib where it leaves the skin) lowered onto the skin from above, bonded'
  - step: 17
    add:
    - wng-006-r
    - wng-006-l
    - wng-007-r
    - wng-007-l
    note: 'C2: Elevons with their balance horns on from aft (horn and lead enter the core pocket; tape hinge after)'
  - step: 18
    add:
    - wng-008-ru
    - wng-008-lu
    note: 'C2a: Upper lens caps (with stop bosses) lowered onto the skin over the strip windows, bonded'
  - step: 19
    add:
    - wng-008-rl
    - wng-008-ll
    note: 'C2b: Lower lens caps (with stop bosses) raised onto the skin, bonded'
  - step: 20
    add:
    - fin-004-r
    note: 'C3: Fairing, right, from outboard'
  - step: 21
    add:
    - fin-004-l
    note: 'C4: Fairing, left, from outboard'
  - step: 22
    add:
    - fin-003-r
    - fin-003-l
    note: 'C5: Root blocks onto the rib ends from aft'
  - step: 23
    add:
    - fin-001-r
    - fin-001-l
    note: 'C6: Fin tubes down through the blocks'
  - step: 24
    add:
    - ger-001-ur
    - ger-001-ul
    note: 'C7: Upper shoes on the tube ends'
  - step: 25
    add:
    - ger-001-lr
    - ger-001-ll
    note: 'C8: Lower shoes on the tube ends'
  - step: 26
    add:
    - ger-002-ur
    - ger-002-ul
    - ger-002-lr
    - ger-002-ll
    note: 'C9: Foot pads on the shoe plates'
  - step: 27
    add:
    - mec-001-r
    - mec-001-l
    note: 'D1: Servos into their pockets'
  - step: 28
    add:
    - mec-002-r
    - mec-002-l
    note: 'D2: Servo arms on the splines'
  - step: 29
    add:
    - hwc-002-r
    - hwc-002-l
    note: 'D2a: Arm screws M2x6 into the servo output shafts'
  - step: 30
    add:
    - mec-004-r
    - mec-004-l
    note: 'D3: Horns on the elevons'
  - step: 31
    add:
    - mec-003-r
    - mec-003-l
    note: 'D4: Pushrods into arm hole (Z-bend) and over the horn blade (clevis cheeks straddle it; pin follows in D5)'
  - step: 32
    add:
    - mec-005-r
    note: 'D5: Clevis pin R pressed in along y through the cheeks and the horn hole (from outboard)'
  - step: 33
    add:
    - mec-005-l
    note: 'D5b: Clevis pin L pressed in along y (from outboard)'
  - step: 34
    add:
    - avn-006
    note: 'E1: Pitot into its groove from the front (left wing, y -420; its attachment block runs in the nose channel)'
  - step: 35
    add:
    - avn-001
    - hwc-003
    note: 'E2: Avionics plate on the skin with its four M2 thin nuts already seated in the hex pockets; before this step, D0: THREAD: each servo 3-wire lead is fed from the servo pocket along its foam groove (3 mm under the skin, aft of the spar) to the slit at x 83 mm / |y| 24 mm with a fish wire; the free end stays out of the slit for the FC pads'
  - step: 36
    add:
    - prp-003
    - avn-007
    - avn-002
    - avn-003
    - avn-004
    - avn-005
    note: 'E3: ESC, foam-tape pads (hard mount), FC on the pads, RX, GPS on the plate; airspeed board into its pocket in the left wing tip'
  - step: 37
    add:
    - hwc-001
    note: 'E3a: Four M2 x 25 screws down through the FC stack into the nuts'
  - step: 38
    add:
    - avn-009-t
    - avn-009-s
    note: 'E3d: Pitot lines (FLEXIBLE silicone: no rigid insertion path, so this step checks the fitted position only, travel 0): each 39 mm line pushed on its probe barb, laid in the pocket over the spar and pushed on its board port; pocket taped'
  - step: 39
    add:
    - pwr-003
    note: 'E3c: Anti-slip pad stuck on the tray floor; before this step, E3b: LAY: solder the ESC signal ribbon to the FC, the servo leads to the FC pads S5 / S6, the RX CRSF lead, the GPS and airspeed leads (JST plugs on the sensor boards)'
  - step: 40
    add:
    - pwr-001
    note: 'E4: Pack into the tray'
  - step: 41
    add:
    - hrn-002
    note: 'E4a: XT60 female with its tail mated to the pack lead XT60 male (plugs on from aft, taped on the skin; tail soldered to the ESC pads after)'
  - step: 42
    add:
    - pwr-002
    note: 'E5: Pack strap threaded under the bridge tube and closed over the pack (FLEXIBLE: no rigid insertion path exists, so this step checks the fitted position only, travel 0; the threading is by hand); before this step, E4b: LAY: mate the pack XT60 male to the XT60 female (E4a) (done in E4a); the vendor pack power leads (E-HRN-13) and balance lead (E-HRN-14) come on the pack and are taped to the skin along their route, the balance plug on the pack top'
  - step: 43
    add:
    - avn-008
    note: 'E7: Bay cover lowered over the FC stack and ESC onto the plate (the sensor leads and the battery tail drop into the roof-open notches; the phase bundles are already inside), foam tape + two ties; before this step, E6: LAY: solder the battery tail to the ESC BAT pads and the 4 x 3 phase leads (free ends from B0 / B2c: out of the foam ditch, up to z 16, over the plate beside the FC, up to z 28 under the cover roof) to the ESC motor pads; heat-shrink'
  - step: 44
    add:
    - hrd-001
    - hrn-001
    note: 'mass proxies (hardware lumps, wiring harness): the source plan has no step for them; added last'
