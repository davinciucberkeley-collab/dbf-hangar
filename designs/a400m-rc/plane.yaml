# Copied from designs/example-tailsitter-wing by `plane new`; edit freely.
schema_version: "1.2"
id: a400m-rc
name: "Airbus A400M Atlas, 1/25 scale RC model"
authors: [platform bootstrap]
status: concept
description: "1/25 scale model of the Airbus A400M Atlas. High wing, T-tail, four wing-mounted nacelles with 8-blade scale propellers, sponson tricycle gear. Dimensions from the Commons three-view in knowledge/reference-aircraft/a400m.md. Not built."
lineage:
  derived_from:
    - example-tailsitter-wing
  inspired_by: []
morphology:
  lift: fixed-wing
  vtol_method: none
  tail: t-tail
  propulsion_count: 4
requirements:
  mtow_g: 2400
  stall_speed_max_mps: 11
  cruise_speed_mps: 18
  budget_usd: 600
  transport_box_mm: [1900, 700, 650]
flight:
  cl_max: 1.3
  air_density_kgm3: 1.2
root: fuselage

components:
