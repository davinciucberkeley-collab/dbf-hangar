    position: [0, 0, 0]
    mass_g: 450
    manufacturing: {method: composite-layup}
  - id: wing
    type: wing
    description: "A400M wing at 1/25 from drawing measurements, anhedral -4 deg (measured -6, no photo check), high placement"
    geometry: {generator: wing_panel, params: {airfoil_file: airfoils/naca2415.dat, span: 1696, root_chord: 318.4, tip_chord: 94.4, sweep_le_deg: 19.2, dihedral_deg: -4, placement: high, fuselage_height: 228, fuselage_center_z: 0, z_offset: -24}}
    position: [520, 0, 0]
    mass_model: {density_g_cm3: 0.035, extra_g: 150}
    manufacturing: {method: hand-cut, machine: jacobs-hand-tools}
    planform: {lifting_surface: {span: 1696, root_chord: 318.4, tip_chord: 94.4, sweep_le_deg: 19.2, dihedral_deg: -4, thickness_ratio: 0.15, airfoil: NACA2415, mirrored: true, lifting: true}, origin: [520, 0, 90]}
