<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1 class="appname">Plane Studio</h1>
    <div class="picker-wrap">
      <button id="design-picker" class="btn" data-testid="design-picker" type="button" aria-haspopup="listbox" aria-expanded="false">Pick a design</button>
      <aside id="sidebar" class="popover" hidden>
        <header class="brand">
          <h1>Designs</h1>
          <span id="count" class="muted"></span>
        </header>
        <div class="filters">
          <input id="filter-text" type="search" placeholder="Filter by name, id, tag" aria-label="Filter designs">
          <select id="filter-vtol" aria-label="Filter by VTOL method"><option value="">All VTOL methods</option></select>
        </div>
        <ul id="design-list" class="design-list"></ul>
        <footer class="muted small" id="generated"></footer>
      </aside>
    </div>
    <nav id="modes" class="seg" role="tablist"></nav>
    <span id="mode-hint" class="muted small"></span>
    <button id="theme-toggle" class="btn" data-testid="theme-toggle" type="button" title="Switch light / dark">Theme</button>
  </header>

  <main id="stage">
    <section id="mode-designs" class="mode inspect" hidden>
      <aside id="parts-tree" class="panel" data-testid="parts-tree"></aside>
      <div id="center-col"><div class="vp-wrap"><div id="vp-main" class="viewport"></div>
        <div id="vp-toolbar" class="vp-toolbar"><div id="tool-bar" class="view-bar"></div><div id="explode-bar" class="view-bar"></div><div id="see-inside" class="view-bar see-inside"></div><div id="view-bar" class="view-bar"></div><div id="colour-bar" class="view-bar"></div></div>
        <div id="apply-bar" class="view-bar" hidden></div></div>
        <div id="timeline" class="timeline" data-testid="timeline" hidden></div></div>
      <div id="side-right"><div id="inspector" class="panel" data-testid="inspector"></div>
        <nav class="seg" role="tablist" id="side-tabs"><button type="button" data-testid="tab-scorecard" class="active">Scorecard</button><button type="button" data-testid="tab-bom">BOM</button></nav>
        <aside id="scorecard" class="panel"></aside>
        <div id="bom-panel" class="panel" hidden data-testid="bom-panel"></div></div>
    </section>

    <section id="mode-compare" class="mode compare" hidden>
      <div class="compare-views">
        <div class="vp-wrap"><div class="vp-head"><span class="slot">A</span><select id="sel-a"></select></div><div id="vp-a" class="viewport"></div></div>
        <div class="vp-wrap"><div class="vp-head"><span class="slot">B</span><select id="sel-b"></select></div><div id="vp-b" class="viewport"></div></div>
      </div>
      <div id="compare-table" class="panel"></div>
    </section>

    <section id="mode-stress" class="mode" hidden><div class="panel"></div></section>
    <section id="mode-updates" class="mode" hidden><div class="panel"></div></section>
    <section id="mode-ledger" class="mode" hidden><div class="panel"></div></section>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
