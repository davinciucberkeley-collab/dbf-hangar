  - id: D-206
    kind: decision
    text: "Bridge tube 12x10 -> 16x14 for torsion (user \"size the fix\", 2026-11-17; sizing engineering). Found by the hub FEA stress map (`review/QP-5/FEA-HUB.md`, run `d205`): the 12 x 10 bridge carries the cage's roll moment in torsion and was over its shear allowable (F2 28.3 MPa at limit, 49 at the 1.725 factor; S2 strike 53.0; allowed 30 `EST`). Earlier checks covered it in bending only. (1) Sized to carry the roll moment alone (`structures/bridge_torsion_d206.md`): worst roll moments from the hub FEA load set are F2 4.37 N m and S2 7.93 N m. The V struts' share lies between about 1 % (pinned sockets) and 60 % (rigid sockets) for the 12 x 10 bridge and is not known. Inertia relief and the tray pad are not counted. Options at tau = M r / J: 14 x 12 fails (30.4 / 32.0); 12 x 8 passes but is not stocked (+4.9 g); 16 x 14 passes (22.6 / 23.8), +2.1 g. (2) Stock: cut from the R02 16 x 14 fin-tube offcut (0.28 m left, 0.108 m needed): no purchase. BOM R02 / R08 notes and `cad/parts_links_a.py` updated. (3) CAD: bridge axis 2 mm below the hub axis (`BR_Z`), so the 16 mm tube top stays tangent to the tray plate underside (z 6.0). Hub boss radius 10.0 mm (2.0 mm wall round the 16 mm bore; 2.5 mm would put the prediction 0.4 g over the 1.465 kg target). Saddle socket and core slot widened; pack strap now passes under z -10. (4) Claims `CL-A-BRIDGE-TORSION-F2` / `-S2` added (`claims_a2_struct.py`). (5) Open: if the struts take their upper-bound share, their printed hub sockets see about 1.5 N m of bending each in the strike, which no analysis checks."
    source: CHANGE-LOG#D-206
