  - id: D-204
    kind: decision
    text: "D-202 CAD round: choices made while drawing the hub (engineering, 2026-11-17). (1) Two continuous 12x10 tubes (552.4 mm, 30.6 g each) at x -81.5 (A: UR, LL) and -68.5 mm (B: LR, UL); hub core by 0.25 mm voxel volume 16.73 g (FEA 16.70), drawn hub 19.0 g with strut sockets and pad. (2) Sleeve outer radius 8.5 mm (6 + 1 doubler + 1.5 sleeve), doubler bore 12.2 mm (0.1 mm gap, as the cup). (3) Bridge end: 0.8 mm x 45 deg chamfer with a matching conical corner in the bore floor (the FEA's 15 MPa bore-end peak; not re-run). (4) Pins: tube A and crossing pins are flush with the sleeve front so they can be inserted (16 / 29 mm instead of 15 / 28); tube B pins get a 3 mm access hole from the block front face (not in the FEA). (5) Phase-lead exits: upper arms on the +t face as in the FEA, LOWER arms on the -t face: on +t they leave at z -3 mm in front of the strut socket boss, which blocks every aft route at lane height. Conduits HRN-004 rebuilt (chimney 12 mm over the tube, aft run, sideways step, drop / rise at x -53 into a raceway window). (6) Mass: basic 1,277.97 g (+16.7 g), CG 19.52 mm (-1.0 mm): predicted 1,475 g flat rule / 1,472 g itemised, OVER the 1,470 g gate by 2-5 g and the 1,460 g target; forward pack travel cut 6 -> 1 mm so the forward trim CG stays 19.3 mm. Structural claims still carry the old hub numbers (FEA-ARM hub section pending)."
