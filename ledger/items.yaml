  - id: D-199
    kind: decision
    text: 'Hub-to-ESC phase run enclosed (raceway), smooth silicone-wire geometry, battery tail under the cover, drawn strap and anti-slip pad (user rule 2026-11-15). (1) Two closed printed raceways HRN-003-R/-L (1.8 g each, 0.6 mm walls, interior 8.4 x 5.4 mm) under the pack tray plate from the hub to the tray end x 22.5, four hub conduits HRN-004- (0.8 g each, along the hub webs, vertical drop at x -52), two slots in the hub tray-pad flange, a core groove and an open foam ditch (x 22.5-32) under the bay cover; every phase bundle is now enclosed from the motor to the ESC pad (exposed 3.6 strand-m -> 0.006); total exposed wire 4.27 -> 0.87 strand-m (0.60 without the vendor pack leads, which are now drawn as wires E-HRN-13 / -14 and counted: 4.54 -> 0.87 like for like). Bundle route 0.456-0.470 m (was 0.53-0.62 m), phase extension wire 1.10 m (was 2.47 m), HRN_ITEMS 17.5 -> 7.8 g. The bridge-tube route stays rejected (D-198). (2) Wire geometry: smooth dense curves (circular arcs, 4 mm at collar and floor hole, 6 mm for the conduits and the 14 AWG tail, 2.5-4 mm for the 28 AWG leads), phase triples lightly twisted (80 mm lay, EST), 0.8 mm drape on the free plate run, round twisted sensor clusters, pack leads following the skin; `_smooth` / `_strands_s` in `electrical.py`, minimum bend radii printed by `wire_inventory.py` (phase 4.0, tail 6.0 mm). (3) Battery tail E-HRN-12 no longer loops out of the cover: it lies on the plate, crosses the cover end wall through a bottom-open slot (roof closed), climbs to z 23.5 under the roof; ESC BAT pad moved 5.5 mm forward (x 104.5, EST layout) for the 6 mm bend; the phase notches of the cover are gone, the GPS lead leaves the plug inboard through a bottom-open slot. (4) PWR-002 strap is now the STRIX 20 x 300 mm buckle strap (V, 5.5 g, BOM W08; was an EST 25 mm hook-and-loop, 3.0 g); the anti-slip pad is drawn (PWR-003, 100 x 30 x 1.0 mm silicone rubber, 3.5 g, BOM W09 EST) and the pack stands 1 mm higher. BOM: W07 20 AWG wire 2 + 2 m ($3.96 V), W08, W09; W05 14 AWG wire cut from 6 m to 4 m; total $1,779.47, +30 % margin +$100.05, G7 PASS. (5) Mass: CAD basic 1,259.74 -> 1,262.64 g (+2.9: raceways +6.8, extension wire -9.7, hub slots -0.2, strap +2.5, pad +3.5), CG 21.32 -> 20.68 mm; forward pack travel 8 -> 6 mm so the forward-trim CG is 19.4 mm; predicted 1,454 g itemised / 1,458.1 g flat rule (target 1,460). (6) Structure: no load path touched, `arm_cup_checks.py` / `qp5_checks.py` unchanged; the pad-flange bond width falls 80 -> 59 mm (no check, bench coupon). (7) Build plan 41 -> 45 steps (B2a raceways from above, B2b conduits from aft, B2c thread, E3c pad; E-HRN-13 / -14 laid with the XT60). (8) Build film: views from below hide the stage floor and shadow. Not decided: pitot tube run (still not designed).'
