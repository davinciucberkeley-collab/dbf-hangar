    text: 'QP-5 re-run of the analyses invalidated by D-193 / D-194; mass accepted, target re-based. (1) Mass: accept 1,449 g (itemised) to 1,454 g (flat rule) predicted, do not cut; design target 1.44 -> 1.46 kg, weigh-in gate stays 1.47 kg (D-190). Basis: 28.8 g of the added mass is the T-Motor adapter and spinner nut (real parts, no earlier lump); the prediction already holds 142 g of maturity growth and 48 g overrun (gate reached only at +16.8 % on the CAD basic, 190 g allowed); capped transition window +-5.8 % at 1.455 kg (floor 5), T/W 2.36 / 1.87 (limits 2.0 / 1.6), cruise to BATT_LOW 4.31 min (need 3.41); structure 479.3 g under the 494 g ceiling. Fallbacks not applied: lead 15.6 -> 12.8 g (-5.6 g, flutter passes), T-Motor hardware pack. (2) Aero: S5010 constants Cm0 0.015 -> +0.008 and zero-lift angle 0 -> -0.52 deg (aerodesign.de section table, own panel check +0.007 / -0.51 deg, AC 0.248 c); CLmax stays 0.75 `EST` (no measured S5010 CLmax found); NP stays 40.7 mm `EST` (SM 7.8 % at the CAD CG; 7.4 % with the CAD prop plane); trim elevon 4.8 deg TE up at 17 m/s, 1.455 kg (was 2.9-3.4). (3) CG band forward edge 20 -> 19 mm (A-P4): the +-10 mm pack slot spans 19.33-23.61 mm; SITL transition and roll at CG 19.3 pass (pitch use 0.59 of 0.60, no saturation). (4) Roll-rate test condition: the QP-4 roll steps ran at 14.4 m/s (stick at mid throttle), not 17; at 14.4 m/s the elevon saturates (86.7 deg/s at 1.455 kg); with the throttle held (16.3-19 m/s) 106.9 / 106.4 deg/s at 1.455 / 1.47 kg: A-P11 passes at cruise speed, the limit 90 is unchanged. (5) Elevon flutter re-run (elevon 6.7 g, hinge inertia 1.485e-5): lowest onset 38.5 m/s hot damper, 33.0 m/s half-filled damper (was 28.5, FAIL row); wing 33.4 m/s fins off; line 28.8. (6) `fe_a.py` motor lump +7.2 g (adapter, nut) and gain margin re-run: min 2.16 (was 2.03). (7) Open, not decided: hub arm-socket wall 0.8 mm gives MS -0.58 on a crude hoop model (needs 2.0 mm, +7.1 g, or a coupon test showing otherwise: ASM-A-HUB-WALL UNVERIFIED); A-P8a heading excursion 25.4 deg in one of seven turbulence seeds; the adapter / nut BOM line (G7 margin +$105.08 holds only about $5 more at +30 %).'
