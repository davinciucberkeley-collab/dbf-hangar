  - id: D-209
    kind: decision
    text: "Arm and motor-cup FEA re-run on the current design; judged zone and bond rule aligned with the hub FEA (user queue item \"arm FEA visuals\", 2026-11-18; structures engineering). The arm FEA (FEA-ARM, 11-16) modelled the replaced D-193 hub; the Explorer showed only the hub map. (1) New variant `current` in `fea_arm.py`: continuous 12 x 10 tube with pin and lead holes, the 14 x 12 doubler and the cup as drawn, fixed on the outer surfaces inside the 24 mm hub sleeve (116 k elements, 0.58 M unknowns). (2) Judged zone: the tube and doubler are judged from s 36 mm (sleeve plus one tube diameter, St-Venant); a first pass judged from the sleeve edge and reported a doubler bond of 7.8 MPa and tube peaks at s 25 mm that were support artefacts (the doubler sticks out of the sleeve by 1 mm). The hub FEA covers s 0-45 mm. (3) Bond rule: mean shear over the bonded area, as `fea_hub.py` (peak and 99th percentile also stored). (4) Cup: judged by the 99th percentile like the hub (D-207); its single highest point is the sharp corner where the sleeve ends on the plate (S2 23.6, S3 39.5 MPa against 20 at factor 1.0). Open item: 1 mm fillet there at the cup's next revision (done: D-210)."
    source: CHANGE-LOG#D-209
    owner: ''
    status: decided
    due: ''
    units: []
    evidence: DBF-Combined redesign/params/CHANGE-LOG.md @ a93f14d
    decided_in: ''
    updated: '2026-11-20'
  - id: D-210
    kind: decision
    text: "Motor cup: 1 mm fillets on the sleeve-to-plate junction and a filleted web joining the lead collar to the plate (user \"Yes, add the fillet\", 2026-11-18; structures engineering). D-209 left the cup's single highest point at the sharp corner where the sleeve ends on the plate (S2 23.6, S3 39.5 MPa against 20). (1) 1 mm fillets on that edge and on the two sleeve-to-plate lines along the arm (`wing.py cup_fillet_loops`, prisms: the fusionkit kinds cannot fillet, but these junctions are straight, so the fillet is an exact constant-section prism). (2) The FEA cup now includes the D-198 lead collar, cap and 4.8 mm phase-lead hole (left out before). That moved the peak to the collar: its 14 mm OD is tangent to the plate face at x 7 mm, so collar and plate met along a bare line, a knife-edge joint (d210a: F2 10.8 MPa, utilisation 1.17). (3) Web: the cusp filled with a 1 mm fillet each side over the collar and cap (`cup_web_loop`), 1 mm fillet where it ends (`cup_chord_loop`). The FEA builds the same five prisms from the same loops."
    source: CHANGE-LOG#D-210
    owner: ''
    status: decided
    due: ''
    units: []
    evidence: DBF-Combined redesign/params/CHANGE-LOG.md @ a93f14d
    decided_in: ''
    updated: '2026-11-20'
  - id: D-211
    kind: decision
    text: 'Wing core drawn as a hand-cut set; buried lead grooves made as knife slits (user "make it something someone could follow and do the cuts by hand", 2026-11-18; manufacturing engineering). The WNG-001 sheet listed 64 raw CAD boxes in the design frame and was hard to follow. (1) `qp/A/drawings/core_hand.py` now draws WNG-001 as 10 sheets, generated from the CAD: method and order of work; 1:1 templates for the two halves split at the spar centre (z 0, as BUILD-GUIDE-A step A1) with the S5010 coordinates; plans of each face of each half (1:2.5); a 41-line cut table (x from the leading edge, y from the centreline, depth from the flat split face, method); 14 full-size sections sliced from the shop mesh; and a trace of all 95 CAD cuts to their table lines (cuts inside a bigger cut to 0.6 mm, or removing no foam, are marked so). (2) Finding: the CAD draws the servo-lead runs (D-198) and the I2C lead groove (D-208) as tunnels 0.7-4.7 mm under the skin. Neither a knife nor the ShopBot can cut a closed tunnel. Decision: cut a knife slit along the line to the groove floor depth and press the lead to the bottom; the XPS closes over it. The CAD groove volume stays (the lead sits there), the slit has no width. (3) Care note: with the split at z 0 the upper half is 0.3 mm thick at the hinge (x 183.75): cut that edge last, supported. No mass, cost or geometry change. Gates not affected (drawing only).'
    source: CHANGE-LOG#D-211
    owner: ''
    status: decided
    due: ''
    units: []
    evidence: DBF-Combined redesign/params/CHANGE-LOG.md @ a93f14d
    decided_in: ''
    updated: '2026-11-20'
