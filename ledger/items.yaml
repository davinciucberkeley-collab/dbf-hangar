  - id: D-201
    kind: decision
    text: "Finding: the hub's radial webs fail at the worst flight case; flight hub on hold until redesigned and re-run through the FEA. 3-D FEA of one arm (sleeve, web, socket, tube, cup; tet10, 0.85 M and 1.56 M unknowns, MATLAB CHOLMOD solve; matches beam theory in the tube to 0.5 %). Flight case F1 (spin-cap thrust 8.81 N, torque 0.130 N m, pitch-over gyro 0.156 N m EST, 1P): tube free span 20.9 MPa (FoS 16.7), motor cup 7.0 MPa (2.9), cup bond 2.9, socket mouth 7.1: PASS. The 0.8 x 22 mm web joining each socket to the sleeve (`hub_arm_spoke`) carries 392 MPa mid-span (FoS 0.05 vs 2.16 required) because the 17 deg cant puts 29 % of the thrust across its thin direction; socket bond and tube-root shear fail as a consequence. No earlier check covered the web (ARMS.md assumed a rigid socket). A hollow 13.6 x 10.4 spoke cuts the peak 10 x but still fails (19.4 MPa mid-span, 102 at the 1.2 mm sleeve). Options in FEA-ARM.md s5 (continuous carbon arm pairs through the hub, or a solid printed core with 18 mm spokes, about +12-15 g EST); not decided."
