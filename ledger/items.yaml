  - id: D-202
    kind: decision
    text: 'Hub redesign: continuous carbon arms, printed crossing hub, carbon doublers and three 3 mm pins; the 30 N prop strike becomes a damage case (factor 1.0); glue coupon before the flight hub (user choices 2026-11-16/17). Replaces the D-193 hub whose 0.8 mm webs failed (D-201). (1) Geometry: opposite arms UR-LL and UL-LR are each one 12x10 tube, crossing at x -6.5 / +6.5 mm through a printed PETG hub: sleeves 1.5 mm wall over s +-24 mm, centre block 20 x 20 mm with 3 mm edge radii, bridge boss r 9.5 to HUB_X1 with the 12x10 bridge bonded from x +15 mm; phase-lead exits 4.8 mm at s +-18 on the tangential face, each under a 14x12 carbon doubler (s 11-32 mm); 3 mm carbon pins along x: one through both tubes at the crossing, one per tube at s +-8 mm. Printed hub 16.70 g (FEA solid). (2) FEA (`fea_hub.py`, tet10, 1.57 M unknowns, bridge tube modelled, equilibrium 6.5e-10): all flight cases pass at the full factors (worst mean bond shear 0.86 vs 0.93; tube hoop 15.7 vs 23.2, shear 13.3 vs 17.4; printed hub p99 <= 6.7 vs 9.3); the prop strike passes at factor 1.0 (tube axial 199 vs 350, hoop 31.7 vs 40, shear 23.1 vs 30, mean bond 1.91 vs 2.0) but not at the full factors, and pins alone (glue released, run `pinsrel`) do not carry it (hoop 59.6 vs 40). Bigger sleeves and 16x12 doublers would add about 9 g and break the 1,470 g gate; a thicker arm tube about 25 g (EST). Decision (user, 2026-11-17): the strike is a damage case: no failure at limit load, inspect the hub after any strike. (3) The 2.0 MPa bond allowable is EST: `COUPON-BOND-D202.md` must show >= 2.0 MPa before the flight hub is printed. (4) Open for the CAD round: the 15 MPa local peak where the bridge tube ends inside the boss (taper or radius it), pin and doubler prices, mass roll-up.'
    source: CHANGE-LOG#D-202
