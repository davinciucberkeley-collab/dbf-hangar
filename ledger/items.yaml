  - id: D-207
    kind: decision
    text: "Hub tidy and fillets; bridge seated on a conical bore floor (user \"tidy and fillet\", 2026-11-17; structures engineering). The d206 stress map showed red spots at the hub's sharp inside corners (sleeve to block, bridge-tube end): singular, so judged by the 99th percentile, but where a printed part cracks first. (1) Block: the centre block now runs on the bridge axis (z -2 mm, `BLK_Z`) to the tray face, 38 mm long (`BLK_AFT`), replacing the separate r 10 bridge boss, so the junctions can be filleted. (2) Fillets: 2.0 mm where sleeve B meets the block, then 1.5 mm for sleeve A (OpenCASCADE staged fillets; filleting all edges at once fails). The CAD hub outer body is now that OpenCASCADE geometry as one mesh body (`cad/amodel/hub_body.py`, cache `hub_body_cache.npz`; new fusionkit shape kind `mesh`, supported by the Blender, stub, manufacturing and proxy-collide backends; the Fusion backend's `_mesh_body` is UNVERIFIED in Fusion). (3) Bore floor: run `d207` (fillets) and its refined check `d207r` (2.4 M DOF; fillet peak 18.3 -> 18.8, converged) left the peak at the sharp bridge-bore floor (S1 24.7 -> 27.7 on refinement). A rounded floor with the bridge stopped 1 mm short (`d208`) made every case worse (S1 56.0, F2 34.0): the bond alone carried the load and ended at the tube's sharp edge. Chosen: the bridge's existing 0.8 mm x 45 deg end chamfer (D-202) seats on a matching 45 deg cone at the bore floor (`BR_CH`, run `d209`); bore depth 9 mm. (4) Mass target re-based 1.465 -> 1.467 kg (A-D3; the hub grew 1.3 g, user accepted about 1 g over on 11-17): 3 g left under the unchanged 1.47 kg gate; the EST cuts that must be real fall from 42.9 to 41.1 g of the 41.6 g. (5) Also fixed: two names lost when the hub body became a mesh (`x_a0`, `x_b1` in `build_cage`)."
