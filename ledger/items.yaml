    text: 'Arm and motor-cup structure closed by analysis (QP-5 ARMS); explicit screw-head pockets in the cup sleeve. Motor cup (no bosses: 5 mm plate, M2.5 heads on the plate, thread into the motor base) checked at cap thrust, uncapped fault, 1P and the 30 N prop strike: lowest margins plate cantilever +0.49 and hole bearing +0.39 (strike); cup-to-arm bond +1.88; arm root with blade offset +0.82 (the earlier +1.41 omitted the 47 mm prop-plane offset). Fatigue over a 10 h life (about 4e6 1P cycles; knock-downs CFRP 0.40, PETG 0.20, bond 0.30 `EST`): lowest hub socket wall +1.17. Arm tip deflection 1.2-1.4 mm at the cap, thrust-line tilt 0.41-0.48 deg inboard on all four (no net force). The two y = -9.5 mm M2.5 heads sit 18 % into the sleeve wall; the build hid this inside the seat cut, so the pocket (5.0 mm, 3 mm deep) is now drawn as a printed feature. Bench: cup coupon (3 off: axial 65 N, transverse 65 N at 35 mm, torque 5.2 / 3.0 N m) joins the hub coupon; pull one motor screw to read the thread depth; 30 min thrust-stand soak with tap tests; cup plate temperature limit 55 C `EST`. If the plate margin is judged thin after coupons: extend the sleeve to +9.5 mm (+0.4 g per cup).'
