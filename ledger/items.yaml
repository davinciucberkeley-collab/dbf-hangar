  - id: D-205
    kind: decision
    text: "Mass and forward-trim recovery after the D-202 hub (user \"cut and shift\", 2026-11-17; details engineering). The D-202 CAD (D-204) predicted 1,475 g against the 1.47 kg gate and had cut forward pack travel to 1 mm. (1) Hub 6 mm aft: `HUB` x -75 -> -69 mm (motors, arm tubes, sleeves, pins move with it; hub aft face / tray face x -45 unchanged, so the boss and the bridge get 6 mm shorter). The phase-lead raceway front follows the hub (`RW_DX` 6 mm); the conduit drop column moves 3.8 mm (`CD_DX`), held ahead of the tray plate front. (2) Doublers s 11-25 (was 11-32): -1.8 g. (3) Lead fallback applied: elevon balance lead 15.6 -> 12.8 g per side (-5.6 g; documented in D-195). Re-run with 12.8 g, all damped cases pass (`structures/flutter_d205.md`): half-filled damper 31.5 m/s (was 33.0), hot 37.5. Wing flutter with fins off 33.7 m/s (`flutter_d205_wing.md`). Limit 28.8 m/s. The undamped case fails as it did at 15.6 g, so the damper stays required. (4) Forward pack travel back to 6 mm (`TRIM_FWD`). (5) Design target 1.46 -> 1.465 kg (A-D3, a derived requirement; the gate stays 1.47 kg and the SITL runs at 1.47). D-205 cut 10.7 g of basic mass against the hub's +16.7 g. The last 2.7 g to 1.46 would need structural cuts not backed by analysis, and the prediction already carries 142 g of growth and 48 g of overrun (D-195 rationale)."
    source: CHANGE-LOG#D-205
