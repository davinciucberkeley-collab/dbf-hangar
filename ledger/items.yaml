    text: 'Concept A wing core and fin fairings machined on the Jacobs ShopBot CNC router; hot wire kept as the backup (user, 2026-11-16). Basis: hot-wire cutting is not on the Jacobs equipment page (MANUFACTURING.md MF-03, checked 2026-11-13) and BOM-A has no hot-wire line; the ShopBot PRSalpha is listed. The user directs the plan to assume XPS is allowed on the ShopBot; this is not confirmed with the Jacobs staff (ask by 30 Nov, SCHEDULE-A). Method (A1): the constant-section S5010 core is machined in two halves split at the spar-bore plane (z 0, D-194 datum), each from a flat slab: side 1 a 1/2 in ball-nose groove (0.35 mm epoxy clearance on the 12 mm spar, EST), side 2 the airfoil surface and the pockets; the halves are bonded on a taped 12 mm rod, so A2 (spar pushed through the bore) is unchanged. Fin fairings C3/C4 faced to 3 mm and profiled on the ShopBot. Backup if refused: hot wire at workspace W, gear about $62.55 (K09-L G11 $46.01 + H05 $16.54, COST-TRADE.md 2026-11-14), bought only if needed: not added to BOM-A, cost unchanged. Open: CAM toolpaths and the S5010 gauge are not generated; the stage 1 film still shows the old "HOT-WIRE" label until the next film render; the viewer part note updates with the next viewer data build.'
